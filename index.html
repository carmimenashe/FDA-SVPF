<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תיק מגדלים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2419; --ink-2:#4a5344; --ink-3:#7c8375;
  --paper:#fbfbf8; --panel:#ffffff; --line:#dfe1d8;
  --field:#3f6b3a; --field-soft:#eaf0e6;
  --clay:#a8631c; --clay-soft:#faf0e2;
  --brick:#973128; --brick-soft:#fbeae7;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Heebo',system-ui,sans-serif; font-weight:400; font-size:16px; line-height:1.6;
  color:var(--ink); background:var(--paper); -webkit-text-size-adjust:100%;
}
a{color:var(--field)}
button{font-family:inherit;font-size:15px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:9px 11px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--field);outline-offset:1px}
label{display:block;font-size:13px;color:var(--ink-2);margin:12px 0 4px}
textarea{min-height:70px;resize:vertical}

header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 16px 8px}
.bar h1{margin:0;font-size:19px;font-weight:500;letter-spacing:-.01em}
.bar span{font-size:12px;color:var(--ink-3)}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 10px 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;color:var(--ink-2);padding:8px 10px 11px;white-space:nowrap;
  border-bottom:2px solid transparent}
nav button.on{color:var(--ink);border-bottom-color:var(--field);font-weight:500}

main{padding:14px 16px 90px;max-width:760px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.stack{display:flex;flex-direction:column;gap:3px;min-width:0}
.name{font-weight:500}
.meta{font-size:13px;color:var(--ink-3);word-break:break-word}
.btn{border:1px solid var(--field);background:var(--field);color:#fff;border-radius:var(--r);padding:9px 14px}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.warn{background:var(--brick);border-color:var(--brick)}
.btn.sm{padding:5px 10px;font-size:13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;white-space:nowrap}
.p-ok{background:var(--field-soft);color:#2c4d28}
.p-warn{background:var(--clay-soft);color:#7a4712}
.p-bad{background:var(--brick-soft);color:#7a2820}
.dots{display:flex;gap:5px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.d-ok{background:var(--field)} .d-warn{background:var(--clay)} .d-bad{background:var(--brick)}
.legend{font-size:12px;color:var(--ink-3);margin:2px 0 12px}
.alert{border-right:3px solid var(--clay);border-radius:0 12px 12px 0}
.alert.bad{border-right-color:var(--brick)}
.empty{text-align:center;color:var(--ink-3);padding:30px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
h2{font-size:17px;font-weight:500;margin:20px 0 8px}
h2:first-child{margin-top:4px}

.sheet{position:fixed;inset:0;background:rgba(20,25,18,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--panel);width:100%;max-width:640px;max-height:92vh;overflow:auto;
  border-radius:16px 16px 0 0;padding:18px 16px 28px}
.sheet h3{margin:0 0 4px;font-size:18px;font-weight:500}
.close{float:left;border:0;background:none;font-size:24px;line-height:1;color:var(--ink-3);padding:0 4px}
.toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:20px;font-size:14px;z-index:80}
.pack{white-space:pre-wrap;font-size:14px;line-height:1.65;direction:ltr;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.setup{max-width:420px;margin:40px auto;padding:0 20px}
@media print{header,nav,.btnrow,.no-print{display:none}.pack{border:0;padding:0}}
</style>
</head>
<body>

<div id="app"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* ---------- הגדרות חיבור ----------
   אפשר להטמיע כאן קבוע, או להשאיר ריק ולהזין פעם אחת במסך ההתקנה. */
const BUILT_IN_URL = 'https://hbwtkrpweobjskphpwgh.supabase.co';
const BUILT_IN_KEY = 'sb_publishable_PPdG7i81vc6p53qOPh_kIw_geMaE8i1';

const cfg = {
  url: BUILT_IN_URL || localStorage.getItem('sb_url') || '',
  key: BUILT_IN_KEY || localStorage.getItem('sb_key') || ''
};
let sb = null, session = null;
let growers = [], docs = [], reg = [], settings = {};
let view = 'status';
const VIEW_ONLY = new URLSearchParams(location.search).has('view');
const app = document.getElementById('app');

/* ---------- עזר ---------- */
const el = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date();
const iso = d => d.toISOString().slice(0,10);
const parse = s => s ? new Date(s + 'T00:00:00') : null;
const days = (a,b) => Math.round((a-b)/86400000);
function fmt(s){ if(!s) return '—'; const d=parse(s); return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`; }
function fmtEn(s){ if(!s) return '—'; const d=parse(s);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
const signer = () => localStorage.getItem('signer') || '';
function setSigner(){
  const v = prompt('שם החותם, כפי שיופיע ברשומות (באנגלית):', signer());
  if(v!==null){ localStorage.setItem('signer', v.trim()); toast('נשמר'); }
}
window.__setSigner = setSigner;
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

const KINDS = { residue:'שאריות הדברה', micro:'מיקרוביולוגיה', water:'בדיקת מים', audit:'דוח מבדק',
  cert:'תעודה', grasp:'GRASP', ppl:'רשימת תכשירים — רשמית', ppl_farm:'רשימת תכשירים — של המגדל',
  declaration:'הצהרת ספק', other:'אחר' };
const KINDS_EN = { residue:'Pesticide residue analysis', micro:'Microbiological analysis',
  water:'Water analysis', audit:'Audit report', cert:'Certificate', grasp:'GRASP',
  ppl:'Plant protection product list (national)',
  ppl_farm:'Plant protection product list (grower)', declaration:'Supplier declaration', other:'Other' };
const RESULTS = { pass:'עובר', pass_qualified:'עובר בהסתייגות', fail:'נכשל', pending:'ממתין', na:'לא רלוונטי' };
const RESULTS_EN = { pass:'Within specification', pass_qualified:'Accepted with limitations',
  fail:'Not accepted', pending:'Pending', na:'—' };

/* ---------- מצב מגדל ---------- */
function latest(gid, kind){
  return docs.filter(d => d.grower_id===gid && d.kind===kind && d.sampled_on)
             .sort((a,b)=>b.sampled_on.localeCompare(a.sampled_on))[0] || null;
}
function certState(g){
  if(!g.cert_to) return {s:'warn', t:'אין תאריך תעודה'};
  const left = days(parse(g.cert_to), today());
  if(left < 0)  return {s:'bad',  t:`התעודה פגה לפני ${-left} ימים`};
  if(left < 60) return {s:'warn', t:`התעודה פגה בעוד ${left} ימים`};
  return {s:'ok', t:`תעודה בתוקף עד ${fmt(g.cert_to)}`};
}
function testState(g, kind){
  const lim = kind==='residue' ? (g.residue_days||90) : (g.micro_days||90);
  const d = latest(g.id, kind);
  const label = kind==='residue' ? 'בדיקת שאריות' : 'בדיקה מיקרוביולוגית';
  if(!d) return {s:'bad', t:`אין ${label} כלל`};
  const age = days(today(), parse(d.sampled_on));
  if(age > lim)      return {s:'bad',  t:`${label} אחרונה לפני ${age} ימים`};
  if(age > lim*0.8)  return {s:'warn', t:`${label} מתקרבת למועד — לפני ${age} ימים`};
  return {s:'ok', t:`${label} מ-${fmt(d.sampled_on)}`};
}
function alerts(){
  const out = [];
  growers.filter(g=>g.active!==false).forEach(g=>{
    [certState(g), testState(g,'residue'), testState(g,'micro')].forEach(st=>{
      if(st.s!=='ok') out.push({sev:st.s, who:g.name, what:st.t, gid:g.id});
    });
  });
  docs.filter(d=>d.result==='fail').forEach(d=>{
    const g = growers.find(x=>x.id===d.grower_id);
    out.push({sev:'bad', who:g?g.name:'—', what:`תוצאה שנכשלה: ${d.title}`, gid:d.grower_id});
  });
  reg.filter(r=>r.direction==='out' && !r.ack).forEach(r=>
    out.push({sev:'bad', who:'FDA', what:`הגשה ללא אישור קליטה: ${r.title}`}));
  return out.sort(a=>a.sev==='bad'?-1:1);
}

/* ---------- טעינה ---------- */
async function loadAll(){
  const [a,b,c,e] = await Promise.all([
    sb.from('growers').select('*').order('name'),
    sb.from('documents').select('*').order('sampled_on',{ascending:false}),
    sb.from('reg_log').select('*').order('happened_on',{ascending:false}),
    sb.from('settings').select('*')
  ]);
  if(a.error||b.error||c.error){ toast('שגיאה בטעינת הנתונים'); console.error(a.error||b.error||c.error); }
  growers = a.data||[]; docs = b.data||[]; reg = c.data||[];
  settings = {}; (e.data||[]).forEach(r=>settings[r.key]=r.value);
}
const certsUrl = () => settings.certs_folder_url || '';
const labsUrl  = () => settings.labs_folder_url  || '';
const pplUrl   = () => settings.ppl_folder_url   || '';
const pplFarmUrl = () => settings.ppl_farm_folder_url || '';
const sedexCo  = () => settings.sedex_company || '';
window.__copyLink = (u)=>{ if(!u) return toast('לא הוגדר'); navigator.clipboard.writeText(u).then(()=>toast('הועתק')); };
window.__copyAll = ()=>{
  const t = ['Certificates: '+certsUrl(), 'Laboratory reports: '+labsUrl(), 'Plant protection product lists: '+pplUrl(), 'Grower pesticide lists: '+pplFarmUrl()].filter(x=>!x.endsWith(': ')).join('\n');
  navigator.clipboard.writeText(t).then(()=>toast('שלושת הקישורים הועתקו'));
};
async function setCertsUrl(){
  const v = prompt('קישור לתיקיית התעודות המשותפת בדרייב:', certsUrl());
  if(v===null) return;
  const {error} = await sb.from('settings').upsert({key:'certs_folder_url', value:v.trim(), updated_at:new Date().toISOString()});
  if(error) return toast('לא נשמר');
  await loadAll(); chrome(); toast('נשמר');
}
window.__setCertsUrl = setCertsUrl;
window.__copyCerts = ()=>{ const u=certsUrl(); if(!u) return toast('לא הוגדר קישור');
  navigator.clipboard.writeText(u).then(()=>toast('הקישור הועתק')); };

/* ---------- שלד ---------- */
function chrome(){
  const tabs = [['status','מצב'],['growers','מגדלים'],['docs','מסמכים'],['pack','חבילת לקוח'],['reg','FDA']];
  app.innerHTML = `
  <header>
    <div class="bar"><h1>תיק מגדלים${VIEW_ONLY?' <span class="pill p-warn" style="vertical-align:middle">צפייה</span>':''}</h1><span>${fmt(iso(today()))}</span></div>
    <nav>${tabs.map(([k,l])=>`<button data-v="${k}" class="${view===k?'on':''}">${l}</button>`).join('')}</nav>
  </header>
  <main id="main"></main>`;
  app.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ view=b.dataset.v; chrome(); });
  ({status:vStatus, growers:vGrowers, docs:vDocs, pack:vPack, reg:vReg})[view]();
}

/* ---------- מצב ---------- */
function vStatus(){
  const al = alerts();
  const m = el('main');
  m.innerHTML = `
    <h2>דורש טיפול</h2>
    ${al.length ? al.map(a=>`
      <div class="card alert ${a.sev==='bad'?'bad':''}">
        <div class="stack"><span class="name">${esc(a.who)}</span>
        <span class="meta">${esc(a.what)}</span></div>
      </div>`).join('')
      : '<div class="card"><div class="meta">אין חריגים פתוחים.</div></div>'}

    <h2>מצב לפי מגדל</h2>
    <div class="legend">שלוש הנקודות: תעודה · שאריות · מיקרוביולוגיה</div>
    ${growers.filter(g=>g.active!==false).map(g=>{
      const st=[certState(g),testState(g,'residue'),testState(g,'micro')];
      return `<div class="card"><div class="row">
        <div class="stack">
          <span class="name">${esc(g.name)}</span>
          <span class="meta">${esc(g.country||'')}${g.ggn?' · GGN '+esc(g.ggn):''}</span>
          ${st.filter(x=>x.s!=='ok').map(x=>`<span class="meta">${esc(x.t)}</span>`).join('')}
        </div>
        <div class="dots">${st.map(x=>`<span class="dot d-${x.s}" title="${esc(x.t)}"></span>`).join('')}</div>
      </div></div>`;
    }).join('')}
    <h2>קישורים לשליחה ללקוחות</h2>
    <div class="card"><div class="stack">
      ${[['תעודות',certsUrl()],['דוחות מעבדה',labsUrl()],['PPL רשמי',pplUrl()],['PPL של המגדל',pplFarmUrl()]].map(([l,u])=>`
        <div class="row" style="align-items:center">
          <span class="meta">${l}${u?'':' — לא הוגדר'}</span>
          <div class="btnrow" style="margin:0">
            <button class="btn sm ghost" onclick="window.__copyLink('${esc(u)}')">העתק</button>
            ${u?`<a class="btn sm ghost" href="${esc(u)}" target="_blank" rel="noopener">פתח</a>`:''}
          </div>
        </div>`).join('')}
      <div class="btnrow" style="margin:10px 0 0">
        <button class="btn sm" onclick="window.__copyAll()">העתק את שלושתם למייל</button>
      </div>
    </div></div>
    ${VIEW_ONLY?'<p class="meta" style="margin-top:20px">מצב צפייה בלבד.</p>':`<div class="btnrow no-print" style="margin-top:20px">
      <button class="btn ghost sm" onclick="window.__setSigner()">שם החותם</button>
      <button class="btn ghost sm" onclick="window.__resetCfg()">שינוי חיבור</button>
    </div>`}`;
}
window.__resetCfg = ()=>{
  if(!confirm('לנתק את החיבור למסד הנתונים במכשיר הזה?')) return;
  localStorage.removeItem('sb_url'); localStorage.removeItem('sb_key'); location.reload();
};

/* ---------- מגדלים ---------- */
function vGrowers(){
  el('main').innerHTML = `
    ${VIEW_ONLY?'':'<div class="btnrow"><button class="btn" id="add">מגדל חדש</button></div>'}
    ${growers.map(g=>{
      const c=certState(g);
      return `<div class="card"><div class="row">
        <div class="stack">
          <span class="name">${esc(g.name)}${g.active===false?' (לא פעיל)':''}</span>
          <span class="meta">${esc(g.country||'')}${g.ggn?' · GGN '+esc(g.ggn):''}</span>
          <span class="meta">${esc(g.products||'')}</span>
          ${g.sedex_zs?`<span class="meta">Sedex ${esc(g.sedex_zs)}${g.sedex_saq?' · SAQ '+fmt(g.sedex_saq):''}</span>`:''}
        </div>
        <div class="stack" style="align-items:flex-start;gap:6px">
          <span class="pill p-${c.s==='ok'?'ok':c.s==='warn'?'warn':'bad'}">${esc(fmt(g.cert_to))}</span>
          ${VIEW_ONLY?'':`<button class="btn sm ghost" data-g="${g.id}">ערוך</button>`}
          ${g.email?`<button class="btn sm ghost" data-mail="${g.id}">מייל</button>`:''}
          ${g.phone?`<button class="btn sm ghost" data-wa="${g.id}">וואטסאפ</button>`:''}
        </div>
      </div></div>`;
    }).join('') || '<div class="empty">אין מגדלים.</div>'}`;
  if(el('add')) el('add').onclick = ()=>editGrower();
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>editGrower(b.dataset.g));
  document.querySelectorAll('[data-mail]').forEach(b=>b.onclick=()=>mailGrower(b.dataset.mail));
  document.querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>waGrower(b.dataset.wa));
}

/* ---------- בניית בקשה לפי מצב המגדל ---------- */
function requestParts(g){
  const c = certState(g), r = testState(g,'residue'), m = testState(g,'micro');
  const he = (g.country||'').indexOf('ישראל')===0;
  const need = [];
  if(c.s!=='ok') need.push(he?'תעודת GLOBALG.A.P. בתוקף — התעודה שבידינו פגה'
                           :'A current GLOBALG.A.P. certificate — the one we hold has expired');
  if(r.s!=='ok') need.push(he?'בדיקת שאריות הדברה עדכנית'
                           :'A current pesticide residue analysis, assessed against Regulation (EC) No 396/2005');
  if(m.s!=='ok') need.push(he?'בדיקה מיקרוביולוגית עדכנית — E. coli וסלמונלה'
                           :'A current microbiological analysis for Escherichia coli and Salmonella');
  if(!need.length) need.push(he?'עדכון מסמכים שוטף':'Updated documentation for our supplier file');
  return {he, need};
}

/* ---------- פתיחת מייל מוכן ---------- */
function mailGrower(id){
  const g = growers.find(x=>x.id===id); if(!g||!g.email) return;
  const {he, need} = requestParts(g);
  const subject = he ? 'בקשת מסמכים — ' + g.name : 'Supplier documentation request — ' + g.name;
  const body = he
    ? `שלום${g.contact?' '+g.contact:''},\n\nלצורך עמידה בדרישות לקוחותינו באירופה נבקש את המסמכים הבאים:\n\n`
      + need.map((n,i)=>`${i+1}. ${n}`).join('\n')
      + `\n\nGGN ${g.ggn||''}\n\nתודה,\nמנשה כרמי\nמנהל בקרת איכות, אגריוור חקלאות בע"מ`
    : `Dear${g.contact?' '+g.contact:' Sir or Madam'},\n\nTo meet the requirements of our European customers we ask for the following:\n\n`
      + need.map((n,i)=>`${i+1}. ${n}`).join('\n')
      + `\n\nGGN ${g.ggn||''}\n\nKind regards,\nMenashe Carmi\nQuality Control Manager, Agriver Agriculture Ltd`;

  window.location.href = 'mailto:' + encodeURIComponent(g.email)
    + '?subject=' + encodeURIComponent(subject)
    + '&body=' + encodeURIComponent(body);
}

/* ---------- פתיחת וואטסאפ מוכן ---------- */
function waGrower(id){
  const g = growers.find(x=>x.id===id); if(!g||!g.phone) return;
  const {he, need} = requestParts(g);
  const txt = he
    ? `שלום${g.contact?' '+g.contact:''}, מדברים מאגריוור.\nלצורך דרישות לקוחותינו באירופה נבקש:\n`
      + need.map((n,i)=>`${i+1}. ${n}`).join('\n') + `\nGGN ${g.ggn||''}\nתודה, מנשה כרמי`
    : `Hello${g.contact?' '+g.contact:''}, this is Agriver.\nFor our European customers we need:\n`
      + need.map((n,i)=>`${i+1}. ${n}`).join('\n') + `\nGGN ${g.ggn||''}\nThank you, Menashe Carmi`;
  window.open('https://wa.me/' + g.phone + '?text=' + encodeURIComponent(txt), '_blank');
}

function editGrower(id){
  const g = id ? growers.find(x=>x.id===id) : {residue_days:90, micro_days:90, active:true};
  open(`
    <button class="close" onclick="window.__close()">×</button>
    <h3>${id?'עריכת מגדל':'מגדל חדש'}</h3>
    <label for="g_name">שם</label><input id="g_name" value="${esc(g.name)}">
    <div class="grid2">
      <div><label for="g_country">מדינה</label><input id="g_country" value="${esc(g.country)}"></div>
      <div><label for="g_ggn">GGN</label><input id="g_ggn" value="${esc(g.ggn)}"></div>
    </div>

/* ---------- רשומת סקירה (Record Review) ---------- */
function buildReview(d){
  const g = growers.find(x=>x.id===d.grower_id) || {};
  const L=[];
  L.push('FSVP / SUPPLIER RECORD REVIEW & ASSESSMENT');
  L.push('');
  L.push('SUPPLIER');
  L.push(g.name || '—');
  if(g.country || g.ggn) L.push([g.country, g.ggn?('GGN '+g.ggn):null].filter(Boolean).join(' · '));
  L.push('');
  L.push('DOCUMENT REVIEWED');
  L.push(`${KINDS_EN[d.kind]||d.kind} — ${[d.lab, d.ref_no].filter(Boolean).join(' ')}`);
  if(d.product)     L.push(`Product: ${d.product}`);
  if(d.sampled_on)  L.push(`Date sampled: ${fmtEn(d.sampled_on)}`);
  if(d.reported_on) L.push(`Date of report: ${fmtEn(d.reported_on)}`);
  if(d.received_on) L.push(`Date received: ${fmtEn(d.received_on)}`);
  if(d.link)        L.push(`Source document: ${d.link}`);
  L.push('');
  L.push('FINDINGS');
  L.push(`Outcome: ${RESULTS_EN[d.result]||d.result}`);
  if(d.criterion) L.push(`Assessed against: ${d.criterion}`);
  if(g.cert_no && d.sampled_on){
    const inWin = g.cert_from && g.cert_to &&
      parse(d.sampled_on) >= parse(g.cert_from) && parse(d.sampled_on) <= parse(g.cert_to);
    L.push(`Certificate ${g.cert_no} valid ${fmtEn(g.cert_from)} to ${fmtEn(g.cert_to)}. Sampling date ${inWin?'falls within':'DOES NOT fall within'} the certificate validity period.`);
  }
  L.push('');
  L.push('LIMITATIONS NOTED');
  L.push(d.notes ? d.notes : 'None recorded.');
  L.push('');
  L.push('DETERMINATION');
  L.push(d.result==='pass' ? 'Accepted as evidence of supplier control for the parameter tested.'
       : d.result==='pass_qualified' ? 'Accepted as supporting evidence only, subject to the limitations stated above. Not sufficient on its own.'
       : d.result==='fail' ? 'NOT ACCEPTED. Corrective action required and the supplier is suspended for the affected food pending resolution.'
       : 'Pending.');
  L.push('');
  L.push('REVIEWED AND SIGNED');
  L.push(`Name: ${d.reviewed_by || '______________________'}`);
  L.push(`Date of review: ${d.reviewed_on ? fmtEn(d.reviewed_on) : '______________________'}`);
  L.push('');
  L.push('Electronic record maintained under 21 CFR 1.510(a); records established to satisfy subpart L are exempt from 21 CFR part 11 under 1.510(d).');
  return L.join('\n');
}

const COUNTRY_EN = {'ישראל':'ISRAEL','קניה':'KENYA','אתיופיה':'ETHIOPIA','רשות פלסטינית':'PALESTINIAN TERRITORIES','לא ידוע':'OTHER'};
function buildPack(ids, win, kinds, fmt){
  const from = new Date(today().getTime() - win*86400000);
  const certOk = g => g.cert_to && parse(g.cert_to) >= today();
  const inWin = (gid,k) => docs.filter(d=>d.grower_id===gid && d.kind===k && d.sampled_on && parse(d.sampled_on)>=from)
                               .sort((a,b)=>b.sampled_on.localeCompare(a.sampled_on));
  const held = (gid,k) => docs.filter(d=>d.grower_id===gid && d.kind===k)
                              .sort((a,b)=>(b.reported_on||'').localeCompare(a.reported_on||''));
  const want = k => kinds.includes(k);
  const testKinds = ['residue','micro','water'].filter(want);

  let list = growers.filter(g=>ids.includes(g.id) && !/chain of custody/i.test(g.name||''));
  // קצר: רק מי שעומד בתנאים — תעודה בתוקף, ובדיקה בחלון אם נבחרו בדיקות
  if(fmt==='short'){
    list = list.filter(g => (!want('cert') || certOk(g)) &&
                            (!testKinds.length || testKinds.some(k=>inWin(g.id,k).length)));
  }
  list.sort((a,b)=>(a.country||'').localeCompare(b.country||'')||a.name.localeCompare(b.name));

  const L=[];
  const single = list.length===1;

  if(fmt==='short'){
    const links=[];
    if(want('cert')||want('grasp')) { if(certsUrl()) links.push('Certificates: '+certsUrl()); }
    if(testKinds.length) { if(labsUrl()) links.push('Lab reports: '+labsUrl()); }
    if(want('ppl')) { if(pplUrl()) links.push('Plant protection product lists: '+pplUrl()); }
    L.push('As requested, please click the link' + (links.length>1?'s':'') + ' below:');
    L.push('');
    links.forEach(x=>L.push(x));
    return L.join('\n');
  }

  // מלא
  L.push(single ? 'SUPPLIER DOCUMENTATION PACK' : 'SUPPLIER ASSURANCE SUMMARY');
  L.push(`Issued: ${fmtEn(iso(today()))} · Analytical coverage: last ${win} days`);
  if(sedexCo()) L.push('Sedex: ' + sedexCo());
  L.push('');
  let country=null;
  list.forEach(g=>{
    if(!single && g.country!==country){ country=g.country; L.push(COUNTRY_EN[country] || (country||'OTHER').toUpperCase()); }
    const head=[g.name]; if(g.ggn) head.push('GGN '+g.ggn);
    if(want('cert')){
      if(g.cert_no||g.cert_to){
        head.push((g.cert_body?g.cert_body+' ':'')+(g.cert_no||''));
        head.push(certOk(g)?'certificate valid to '+fmtEn(g.cert_to):'CERTIFICATE EXPIRED '+fmtEn(g.cert_to));
      } else head.push('certificate details not on file');
    }
    L.push(head.join(' · '));
    if(g.sedex_zs) L.push(`  Sedex site: ${g.sedex_zs}${g.sedex_saq?' · SAQ completed '+fmtEn(g.sedex_saq):''}`);
    if(g.products) L.push(`  Products: ${g.products}`);
    if(g.markets)  L.push(`  Declared markets: ${g.markets}`);
    if(want('grasp')){ const gr=held(g.id,'grasp')[0]; if(gr) L.push(`  GRASP: ${gr.ref_no||''}${gr.expires_on?' · valid to '+fmtEn(gr.expires_on):''}`); }
    const brc = docs.find(d=>d.grower_id===g.id && /BRC/i.test(d.title||''));
    if(want('cert') && brc) L.push(`  BRCGS: ${brc.ref_no||''}${brc.expires_on?' · valid to '+fmtEn(brc.expires_on):''}${/AA\+/.test(brc.notes||'')?' · grade AA+':''}`);
    const block=(k,label)=>{
      if(!want(k)) return;
      const rows=inWin(g.id,k);
      if(!rows.length){ L.push(`  ${label}: none on file within the period`); return; }
      rows.forEach(r=>{ L.push(`  ${label}: ${fmtEn(r.sampled_on)} · ${r.product||'—'} · ${r.lab||'—'} · ${r.ref_no||''} · ${RESULTS_EN[r.result]||r.result}`);
                        if(r.criterion) L.push(`    Assessed against: ${r.criterion}`);
                        if(r.notes) L.push(`    Note: ${r.notes}`); });
    };
    block('residue','Residue'); block('micro','Micro'); block('water','Water');
    if(want('audit')){ const a=held(g.id,'audit')[0]; if(a) L.push(`  Audit: ${fmtEn(a.reported_on)} · ${a.lab||''} · ${a.ref_no||''}${a.notes?' · '+a.notes:''}`); }
    L.push('');
  });
  const links=[];
  if(want('cert')||want('grasp')) { if(certsUrl()) links.push('Certificates: '+certsUrl()); }
  if(testKinds.length) { if(labsUrl()) links.push('Laboratory reports: '+labsUrl()); }
  if(want('ppl')) { if(pplUrl()) links.push('Plant protection product lists: '+pplUrl()); }
  if(want('ppl_farm')) { if(pplFarmUrl()) links.push('Grower pesticide lists: '+pplFarmUrl()); }
  if(links.length){ links.forEach(x=>L.push(x)); L.push(''); }
  L.push('Certification status is verified against the GLOBALG.A.P. Supply Chain Portal and is confirmable at https://www.globalgap.org/validate');
  L.push(''); L.push('DECLARATION'); L.push('The documents referenced above are true copies of the records held for these suppliers. Where a testing interval requested is not covered by an analysis on file, this is stated openly rather than omitted.');
  L.push(''); L.push('Prepared by: ______________________    Date: ______________________');
  return L.join('\n');
}

/* ---------- יומן FDA ---------- */
function vReg(){
  el('main').innerHTML = `
    ${VIEW_ONLY?'':'<div class="btnrow"><button class="btn" id="add">רשומה חדשה</button></div>'}
    ${reg.map(r=>`<div class="card"><div class="row">
      <div class="stack">
        <span class="name">${esc(r.title)}</span>
        <span class="meta">${fmt(r.happened_on)} · ${esc(r.party||'')}</span>
        ${r.ref_no?`<span class="meta">אסמכתא ${esc(r.ref_no)}</span>`:''}
        ${r.items?`<span class="meta">${esc(r.items)}</span>`:''}
        ${r.notes?`<span class="meta">${esc(r.notes)}</span>`:''}
      </div>
      <div class="stack" style="align-items:flex-start;gap:6px">
        ${r.direction==='out' ? (r.ack
          ? `<span class="pill p-ok">נקלט${r.ack_on?' '+fmt(r.ack_on):''}</span>`
          : '<span class="pill p-bad">ללא אישור</span>') : ''}
        ${VIEW_ONLY?'':`<button class="btn sm ghost" data-r="${r.id}">ערוך</button>`}
      </div>
    </div></div>`).join('') || '<div class="empty">היומן ריק.</div>'}`;
  if(el('add')) el('add').onclick = ()=>editReg();
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>editReg(b.dataset.r));
}

function editReg(id){
  const r = id ? reg.find(x=>x.id===id) : {kind:'response', direction:'out', happened_on:iso(today())};
  const K = {inspection:'ביקורת', form483:'Form 483', response:'הגשה ל-FDA', closure:'סגירת תיק',
    notice:'הודעה מרשות', record:'רשומה פנימית', other:'אחר'};
  const D = {out:'נשלח', in:'התקבל', int:'פנימי'};
  open(`
    <button class="close" onclick="window.__close()">×</button>
    <h3>${id?'עריכת רשומה':'רשומה חדשה'}</h3>
    <div class="grid2">
      <div><label for="r_d">תאריך</label><input type="date" id="r_d" value="${esc(r.happened_on)}"></div>
      <div><label for="r_k">סוג</label><select id="r_k">${Object.entries(K).map(([k,l])=>`<option value="${k}" ${r.kind===k?'selected':''}>${l}</option>`).join('')}</select></div>
    </div>
    <label for="r_dir">כיוון</label>
    <select id="r_dir">${Object.entries(D).map(([k,l])=>`<option value="${k}" ${r.direction===k?'selected':''}>${l}</option>`).join('')}</select>
    <label for="r_t">כותרת</label><input id="r_t" value="${esc(r.title)}">
    <label for="r_te">Title (English)</label><input id="r_te" value="${esc(r.title_en)}">
    <label for="r_p">גורם / איש קשר</label><input id="r_p" value="${esc(r.party)}">
    <label for="r_ref">אסמכתא</label><input id="r_ref" value="${esc(r.ref_no)}">
    <label for="r_i">פריטים בהגשה</label><textarea id="r_i">${esc(r.items)}</textarea>
    <label for="r_a">אישור קליטה</label>
    <select id="r_a"><option value="1" ${r.ack?'selected':''}>התקבל</option>
      <option value="0" ${!r.ack?'selected':''}>לא התקבל</option></select>
    <div class="grid2">
      <div><label for="r_ao">תאריך האישור</label><input type="date" id="r_ao" value="${esc(r.ack_on)}"></div>
      <div><label for="r_ar">אסמכתת האישור</label><input id="r_ar" value="${esc(r.ack_ref)}"></div>
    </div>
    <label for="r_ab">ממי התקבל</label><input id="r_ab" value="${esc(r.ack_by)}">
    <label for="r_l">קישור</label><input id="r_l" value="${esc(r.link)}">
    <label for="r_n">הערות</label><textarea id="r_n">${esc(r.notes)}</textarea>
    <div class="btnrow">
      <button class="btn" id="save">שמור</button>
      ${id?'<button class="btn warn" id="del">מחק</button>':''}
      <button class="btn ghost" onclick="window.__close()">ביטול</button>
    </div>`);
  el('save').onclick = async ()=>{
    const v = x => el(x).value.trim() || null;
    const rec = { happened_on:v('r_d'), kind:el('r_k').value, direction:el('r_dir').value,
      title:v('r_t'), title_en:v('r_te'), party:v('r_p'), ref_no:v('r_ref'), items:v('r_i'),
      ack:el('r_a').value==='1', ack_on:v('r_ao'), ack_by:v('r_ab'), ack_ref:v('r_ar'),
      link:v('r_l'), notes:v('r_n') };
    if(!rec.title) return toast('צריך כותרת');
    const q = id ? sb.from('reg_log').update(rec).eq('id',id) : sb.from('reg_log').insert(rec);
    const {error} = await q;
    if(error) return toast('לא נשמר');
    await loadAll(); close(); chrome(); toast('נשמר');
  };
  if(id) el('del').onclick = async ()=>{
    if(!confirm('למחוק את הרשומה?')) return;
    await sb.from('reg_log').delete().eq('id',id);
    await loadAll(); close(); chrome(); toast('נמחק');
  };
}

/* ---------- חלונית ---------- */
function open(html){
  const s = document.createElement('div');
  s.className='sheet'; s.id='sheet';
  s.innerHTML = `<div>${html}</div>`;
  s.onclick = e => { if(e.target===s) close(); };
  document.body.appendChild(s);
}
function close(){ const s=el('sheet'); if(s) s.remove(); }
window.__close = close;

/* ---------- התקנה והתחברות ---------- */
function setupScreen(msg){
  app.innerHTML = `<div class="setup">
    <h1 style="font-size:20px;font-weight:500">חיבור למסד הנתונים</h1>
    <p class="meta">מתוך Supabase: Project Settings ← API. מזינים פעם אחת במכשיר.</p>
    ${msg?`<p class="meta" style="color:var(--brick)">${esc(msg)}</p>`:''}
    <label for="s_url">Project URL</label><input id="s_url" value="${esc(cfg.url)}" placeholder="https://xxxx.supabase.co">
    <label for="s_key">Anon public key</label><input id="s_key" value="${esc(cfg.key)}">
    <div class="btnrow"><button class="btn" id="s_go">שמור והמשך</button></div>
  </div>`;
  el('s_go').onclick = ()=>{
    const u=el('s_url').value.trim(), k=el('s_key').value.trim();
    if(!u||!k) return toast('צריך שניהם');
    localStorage.setItem('sb_url',u); localStorage.setItem('sb_key',k);
    cfg.url=u; cfg.key=k; boot();
  };
}

async function start(){ await loadAll(); chrome(); }

async function boot(){
  if(!cfg.url || !cfg.key) return setupScreen();
  try { sb = createClient(cfg.url, cfg.key); }
  catch(e){ return setupScreen('כתובת או מפתח לא תקינים'); }
  start();
}
boot();
</script>
